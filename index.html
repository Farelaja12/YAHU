<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lirik Kode</title>
<style>
  :root {
    --bg: #0d0d0f;
    --fn: #7aa2f7;      /* nama fungsi */
    --str: #b5e65c;     /* teks dalam kutip */
    --key: #d66bd3;     /* kunci */
    --punc: #e8a85b;    /* kurung dan kurawal */
    --cursor: #ff3b4e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    font-size: clamp(11px, 1.8vw, 24px);
    color: #ddd;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #cam {
    position: absolute; inset: 0;
    transform-origin: 0 50%;          /* zoom terhadap tengah layar, posisi diatur lewat JS */
    will-change: transform;
  }
  #world {
    position: absolute; left: 6vw; top: 50%;
    transition: transform 350ms cubic-bezier(.22,.8,.25,1), opacity 600ms ease;
  }
  .line {
    position: relative;
    white-space: nowrap;
    line-height: 2.6;
    transform-origin: left center;
    transition: opacity 350ms ease, transform 350ms cubic-bezier(.22,.8,.25,1);
  }
  .fn { color: var(--fn); }
  .str { color: var(--str); }
  .key { color: var(--key); }
  .punc { color: var(--punc); }
  .cursor {
    display: inline-block; width: .6em; height: 1.1em; vertical-align: text-bottom;
    background: var(--cursor); border-radius: 2px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
</style>
</head>
<body>
<div id="stage"><div id="cam"><div id="world"></div></div></div>

<script>
/* ==========================================================
   ISI BAGIAN INI DENGAN TEKS ANDA SENDIRI
   Tiap baris punya 4 bagian:
   fn  : kata pertama sebelum kurung (biru), contoh: "kita.bilang"
   arg : teks di dalam kurung pertama (hijau)
   key : kunci setelah kurawal (ungu)
   val : teks nilai (hijau)
   Contoh hasil:  kita.bilang( "halo_dunia" ){ salam: "selamat datang" }
   ========================================================== */
const LINES = [
  { fn: "when.yah", arg: "One night", key: "I was", val: "bored in bed" },
  { fn: "when.yah", arg: "And stalked",    key: "you on",   val: "the internet" },
  { fn: "when.yah", arg: "It's feminine",   key: "intuition" },   
  { fn: "when.yah", arg: "Cuz I always",    key: "had a vision of us",   val: "standing like this" },
  { fn: "when.yah", arg: "All pressed up",    key: "in the",   val: "bathroom line" },
  { fn: "when.yah", arg: "You're looking",    key: "like an angel on",   val: "the walls of Versailles" },
  { fn: "when.yah", arg: "The most",    key: "alive I've",   val: "ever been" },
  { fn: "when.yah", arg: "But kiss",    key: "me and",   val: "I might" },
  ];

// Bagian yang dikosongkan tidak akan menyebabkan error
LINES.forEach(l => { l.fn = l.fn ?? ""; l.arg = l.arg ?? ""; l.key = l.key ?? ""; l.val = l.val ?? ""; });

/* ---- Tempo: semua waktu dihitung dalam ketukan ---- */
const BPM = 170;            // tempo lagu (130 = sekitar tempo drop dead)
const TYPE_BEATS = 3;       // lama mengetik satu baris (dalam ketukan)
const HOLD_BEATS = 0.5;     // jeda setelah baris selesai
const OUT_BEATS = 0.5;      // lama zoom out sebelum pindah baris
                            // total satu baris = 3 + 0.5 + 0.5 = 4 ketukan = 1 bar
const BEAT = 60000 / BPM;   // 1 ketukan dalam ms

const ACTIVE_ZOOM = 1.05;   // pembesaran kecil baris yang sedang diketik
const ZOOM_IN = 1.7;        // kamera mendekat saat mengetik (1 = tanpa zoom)
const END_ZOOM = 0.8;       // zoom out terakhir setelah semua baris selesai
const FOLLOW_MS = 150;      // kehalusan kamera mengikuti cursor (kecil = lebih cepat)
const FADE_STEP = 0.38;     // pudar per baris ke atas
const VISIBLE_BACK = 3;     // berapa baris lama yang masih terlihat samar

const world = document.getElementById("world");
const cam = document.getElementById("cam");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* ---- Kamera: zoom dan mengikuti cursor ---- */
let s = 1, targetS = 1, zoomTau = 400;   // skala sekarang dan target
let fx = 0, targetFx = 0;                // posisi cursor (px) dari awal baris
let lastT = performance.now();

function zoom(scale, ms) { targetS = scale; zoomTau = Math.max(1, ms / 3); }
function followX(x) { targetFx = x; }

function tick(now) {
  const dt = Math.min(64, now - lastT);
  lastT = now;
  s  += (targetS  - s)  * (1 - Math.exp(-dt / zoomTau));
  fx += (targetFx - fx) * (1 - Math.exp(-dt / FOLLOW_MS * 3));
  const W = window.innerWidth, L = W * 0.06;
  const txStart  = L * (1 - s);              // awal baris tetap di margin kiri
  const txFollow = W * 0.5 - s * (L + fx);   // cursor di tengah layar
  const tx = Math.min(txStart, txFollow);
  cam.style.transform = `translate(${tx}px, 0) scale(${s})`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---- Tampilan teks ---- */
function html(l, n) {
  const parts = [
    ['fn',   l.fn],
    ['punc', '( "'],
    ['str',  l.arg],
    ['punc', '" ){ '],
    ['key',  l.key + ': '],
    ['punc', '"'],
    ['str',  l.val],
    ['punc', '" }'],
  ];
  let left = n, out = "";
  for (const [cls, text] of parts) {
    if (left <= 0) break;
    const piece = text.slice(0, left);
    left -= piece.length;
    out += `<span class="${cls}">${esc(piece)}</span>`;
  }
  return out;
}
const total = l => l.fn.length + 3 + l.arg.length + 4 + l.key.length + 2 + 1 + l.val.length + 2;

// Baris aktif di tengah, baris lama memudar
function focus(active) {
  const els = world.children;
  if (!els.length) return;
  const lh = els[0].offsetHeight;
  world.style.transform = `translateY(${-(active + 0.5) * lh}px)`;
  for (let j = 0; j < els.length; j++) {
    const d = active - j;
    const el = els[j];
    if (d === 0) {
      el.style.opacity = 1;
      el.style.transform = `scale(${ACTIVE_ZOOM})`;
    } else {
      el.style.opacity = d > VISIBLE_BACK ? 0 : Math.max(0.08, 1 - d * FADE_STEP);
      el.style.transform = "scale(1)";
    }
  }
}

async function run() {
  world.innerHTML = "";
  world.style.transition = "none";
  world.style.transform = "translateY(0)";
  void world.offsetHeight;           // paksa reflow
  world.style.transition = "";
  s = targetS = 1; fx = targetFx = 0;

  for (let i = 0; i < LINES.length; i++) {
    const l = LINES[i];
    const el = document.createElement("div");
    el.className = "line";
    el.style.opacity = 0;
    world.appendChild(el);
    focus(i);                        // geser ke baris baru
    followX(0);
    const typeMs = TYPE_BEATS * BEAT;
    zoom(ZOOM_IN, typeMs);           // zoom in sepanjang mengetik
    const len = total(l);
    const t0 = performance.now();
    let k = -1;
    while (k < len) {                // jumlah huruf mengikuti waktu, jadi tetap pas dengan tempo
      const next = Math.min(len, Math.floor((performance.now() - t0) / typeMs * (len + 1)));
      if (next !== k) {
        k = next;
        el.innerHTML = html(l, k) + '<span class="cursor"></span>';
        const c = el.querySelector(".cursor");
        if (c) followX(c.offsetLeft * ACTIVE_ZOOM);   // kamera ikut cursor
      }
      await sleep(8);
    }
    el.innerHTML = html(l, len);     // cursor hilang setelah selesai
    await sleep(HOLD_BEATS * BEAT);
    if (i < LINES.length - 1) {
      zoom(1, OUT_BEATS * BEAT);     // zoom out sebelum pindah baris
      followX(0);
      await sleep(OUT_BEATS * BEAT);
    }
  }
  zoom(END_ZOOM, 1800);              // zoom out panjang di akhir
  followX(0);
  await sleep(2400);
  world.style.opacity = 0;           // pudar lalu ulang dari awal
  await sleep(900);
  world.style.opacity = 1;
  run();
}
run();
</script>
</body>
</html>
